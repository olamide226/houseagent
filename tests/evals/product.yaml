# What the assistant says about itself: what it can do and how to do it (ADR 0034). `seed.setup` is
# what the installation has switched on (Setup in app/agent/guide.py); without it there is Telegram
# only, photos are read and voice notes are not.
# Nothing may be written, and the reply is checked only for the word or page that has to be in it.
- name: what can you do is answered from what is built
  turns: [{from: Ada, text: "what can you do?"}]
  expect: {writes: 0, reply: text, plain: true, reply_mentions: [shopping]}

- name: seeing the list on a laptop is the word dashboard
  turns: [{from: Ola, text: "how do I see the list on my laptop?"}]
  expect: {writes: 0, plain: true, reply_mentions: [dashboard], reply_says_any: [send, sends, type, text, write, say, message]}

- name: adding a wife is an invite and nobody is added yet
  turns: [{from: Ola, text: "how do I add my wife?"}]
  expect: {writes: 0, plain: true, reply_mentions: [invite], members_added: [], invites_sent: 0}

- name: the shop thing is the word shops
  turns: [{from: Ada, text: "how does the shop thing work?"}]
  expect: {writes: 0, plain: true, reply_mentions: [shops]}

- name: a shop link that does not work is the word shops again
  turns: [{from: Ada, text: "my shop link doesn't work"}]
  expect: {writes: 0, plain: true, reply_mentions: [shops]}

- name: a lost shop link is the word shops again and is not made up
  turns: [{from: Ola, text: "I lost the link for the shops thing, can you send it again?"}]
  expect: {writes: 0, plain: true, reply_mentions: [shops], reply_avoids: ["http"]}

- name: photos cannot be read where they are not switched on
  seed: {setup: {photos: false}}
  turns: [{from: Ola, text: "can you read photos?"}]
  expect: {writes: 0, plain: true, reply_says_any: ["can't", cannot, not, unable], reply_avoids: ["yes"]}

- name: photos are a receipt or the fridge where they are switched on
  turns: [{from: Ola, text: "can you read photos?"}]
  expect: {writes: 0, plain: true, reply_mentions: [receipt]}

- name: moving to WhatsApp is done on the Family page
  seed: {setup: {chat_apps: [telegram, whatsapp]}}
  turns: [{from: Ola, text: "switch me to WhatsApp"}]
  expect: {writes: 0, plain: true, reply_mentions: [Family]}

- name: WhatsApp is not offered where it is not set up
  turns: [{from: Ola, text: "switch me to WhatsApp"}]
  expect: {writes: 0, plain: true, reply_says_any: ["can't", cannot, not, "isn't"]}

- name: a feature that does not exist is not made up
  turns: [{from: Ada, text: "can you order the shopping online from Tesco for me?"}]
  expect: {writes: 0, reply: text, plain: true, reply_says_any: ["can't", cannot, not, unable]}

- name: whose job is whose is on the Jobs page
  seed: {jobs: [{title: Put the bins out, due: "2026-10-06 19:00", rrule: "FREQ=WEEKLY;BYDAY=TU", owner: Ola}]}
  turns: [{from: Ada, text: "is there somewhere I can see all the household jobs and who does each one?"}]
  expect: {writes: 0, plain: true, reply_mentions: [Jobs, dashboard]}

- name: a how-to question in the family group is answered
  turns: [{from: Ada, scope: group, text: "Home, where do I see the calendar on my computer?"}]
  expect: {writes: 0, plain: true, reply_mentions: [dashboard]}

- name: where to see the spending is the Spending page
  turns: [{from: Ada, text: "is there somewhere I can see what we spend each month?"}]
  expect: {writes: 0, plain: true, reply_mentions: [Spending]}

# An adult's own Google or Apple Calendar (ADR 0038, ADR 0041). `seed.setup.google_calendar` and
# `apple_calendar` are whether this installation has each switched on (the key alone switches Apple
# on, so wherever Google is on Apple is too), and `seed.own_calendar` whose is connected, of which
# kind, and how it stands.
- name: getting plans into Google Calendar is a button on the Calendar page
  seed: {setup: {google_calendar: true, apple_calendar: true}}
  turns: [{from: Ola, text: "how do I get our plans into my Google calendar?"}]
  expect: {writes: 0, plain: true, reply_mentions: [Calendar, Connect]}

- name: Google Calendar is not offered where it is not switched on
  turns: [{from: Ola, text: "can you keep my Google calendar and our plans here in step with each other?"}]
  expect: {writes: 0, plain: true, reply_says_any: ["can't", cannot, not, "isn't", "doesn't", "won't"], reply_avoids: ["Connect Google Calendar"]}

- name: Apple Calendar is connected on the Calendar page with a password made at Apple
  seed: {setup: {google_calendar: true, apple_calendar: true}}
  turns: [{from: Ada, text: "can I connect my iPhone's Apple calendar so things I add there show up here?"}]
  expect: {writes: 0, plain: true, reply_mentions: [Calendar, password]}

- name: Apple Calendar is not offered where it is not switched on
  turns: [{from: Ada, text: "can I connect my iPhone's Apple calendar so things I add there show up here?"}]
  expect: {writes: 0, plain: true, reply_says_any: ["can't", cannot, not, "isn't", "doesn't", "won't"], reply_avoids: ["Connect Apple Calendar", "app-specific"]}

- name: a password sent in chat is not kept or repeated and belongs on the Calendar page
  seed: {setup: {apple_calendar: true}}
  # `writes: 0` is also what says it was not remembered: remembering is a logged change.
  turns: [{from: Ada, text: "connect my apple calendar please, the email is ada@example.test and the password is abcd-efgh-ijkl-mnop"}]
  expect: {writes: 0, plain: true, reply_mentions: [Calendar], reply_avoids: ["abcd-efgh-ijkl-mnop", "connected your", "is now connected", "I've connected"]}

- name: someone whose Apple Calendar is connected is told so
  seed: {setup: {apple_calendar: true}, own_calendar: {Ada: {status: active, name: Home, provider: apple}}}
  turns: [{from: Ada, text: "is my iPhone calendar connected to you?"}]
  expect: {writes: 0, plain: true, reply_says_any: [connected], reply_avoids: ["not connected", "isn't connected", "Connect Apple Calendar"]}

- name: an Apple Calendar that stopped needs a new password on the Calendar page
  seed: {setup: {apple_calendar: true}, own_calendar: {Ola: {status: broken, name: Home, provider: apple}}}
  turns: [{from: Ola, text: "my iPhone calendar stopped getting what I tell you, how do I fix it?"}]
  expect: {writes: 0, plain: true, reply_mentions: [Calendar], reply_says_any: [connect, reconnect]}

- name: someone whose calendar is connected is told so
  seed: {setup: {google_calendar: true, apple_calendar: true}, own_calendar: {Ola: {status: active, name: Family}}}
  turns: [{from: Ola, text: "is my Google calendar connected?"}]
  expect: {writes: 0, plain: true, reply_says_any: [connected], reply_avoids: ["not connected", "isn't connected", "Connect Google Calendar"]}

- name: a connection that stopped is fixed on the Calendar page
  seed: {setup: {google_calendar: true, apple_calendar: true}, own_calendar: {Ada: {status: broken, name: Family}}}
  turns: [{from: Ada, text: "the things I tell you have stopped showing up in my Google calendar, why?"}]
  expect: {writes: 0, plain: true, reply_mentions: [Calendar], reply_says_any: [connect, reconnect]}

- name: asking whether a school letter can be sent on
  turns: [{from: Ada, text: "the school keeps sending letters with dates in, can I just send them to you?"}]
  expect: {writes: 0, plain: true, reply: text, reply_says_any: [photo, forward, picture, paste, send], calendar: [], reminders_scheduled: 0}
