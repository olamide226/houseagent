apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "household-agent.name" . }}-api
  labels:
    {{- include "household-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  # A new pod is ready before the old one goes, so a deploy drops no webhook even at one replica.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "household-agent.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "household-agent.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "household-agent.scheduling" . | nindent 6 }}
      {{- with (include "household-agent.codexHomeOwner" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if .Values.api.migrate }}
      initContainers:
        - name: migrate
          image: {{ include "household-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          {{- include "household-agent.env" . | nindent 10 }}
          {{- include "household-agent.securityContext" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      {{- end }}
      containers:
        - name: api
          image: {{ include "household-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", {{ .Values.api.port | quote }}]
          ports:
            - {name: http, containerPort: {{ .Values.api.port }}}
          {{- include "household-agent.env" . | nindent 10 }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "household-agent.securityContext" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- with (include "household-agent.codexHomeMount" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- with (include "household-agent.codexHomeVolume" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "household-agent.name" . }}-api
  labels:
    {{- include "household-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "household-agent.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: {{ .Values.api.port }}, targetPort: http}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "household-agent.name" . }}-api
  labels:
    {{- include "household-agent.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "household-agent.name" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
