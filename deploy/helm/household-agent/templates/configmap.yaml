apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "household-agent.name" . }}
  labels:
    {{- include "household-agent.labels" . | nindent 4 }}
data:
  {{- range $name, $value := .Values.config }}
  {{- if ne (toString $value) "" }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  WORKER_HEARTBEAT_FILE: {{ .Values.worker.heartbeatFile | quote }}
  {{- if .Values.codexHome.existingClaim }}
  CODEX_HOME: {{ .Values.codexHome.mountPath | quote }}
  {{- end }}
  {{- if eq (toString .Values.config.AGENT_RUNTIME) "letta" }}
  {{- /* Where Letta's tools reach each process's /internal/tools: in the cluster, never the ingress. */}}
  INTERNAL_BASE_URL: {{ printf "http://%s-api:%v" (include "household-agent.name" .) .Values.api.port | quote }}
  WORKER_INTERNAL_URL: {{ printf "http://%s-worker:%v" (include "household-agent.name" .) .Values.worker.internalPort | quote }}
  {{- end }}
